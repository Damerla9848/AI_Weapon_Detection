<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weapon Detection — YOLOv8</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="nav.css"/>
</head>
<body>

  <!-- nav.js injects <nav> and <div id="toast-container"> here automatically -->

  <!-- MAIN -->
  <main>
    <div class="page-title">
      <h1>Weapon Detection</h1>
      <div class="accent-line"></div>
      <p>UPLOAD AN IMAGE · RUN YOLOV8S INFERENCE · VIEW RESULTS</p>
    </div>

    <!-- Upload Card -->
    <div class="upload-card" id="upload-card">
      <div class="br"></div>
      <div class="bl"></div>
      <div class="drop-zone" id="drop-zone">
        <svg class="upload-svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="3" y="3" width="18" height="18" rx="1"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21,15 16,10 5,21"/>
        </svg>
        <div class="drop-title">Drop Image Here</div>
        <div class="drop-sub">PNG · JPG · JPEG · BMP · WEBP</div>
        <button class="btn-browse" id="btn-browse">Browse File</button>
      </div>
      <div class="file-preview" id="file-preview">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
          <polyline points="14,2 14,8 20,8"/>
        </svg>
        <span id="file-name">—</span>
      </div>
    </div>

    <input type="file" id="file-input" accept="image/*"/>

    <button class="btn-detect" id="btn-detect">&#x2B21; &nbsp; Run Detection</button>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      <div class="loader-text">ANALYZING</div>
    </div>

    <div class="result-section" id="result-section">
      <div class="verdict-banner" id="verdict-banner">
        <div class="verdict-label" id="verdict-label">—</div>
        <div class="verdict-meta" id="verdict-meta"></div>
      </div>
      <div class="result-grid">
        <div class="result-image-box">
          <div class="scan-anim" id="scan-anim"></div>
          <img id="result-img" src="" alt="Detection result"/>
        </div>
        <div class="detections-panel">
          <div class="panel-head">Detections</div>
          <div class="detections-list" id="detections-list">
            <div class="no-det">No data yet</div>
          </div>
        </div>
      </div>
      <div class="actions-row">
        <a class="btn-action dl" id="download-btn" href="#" download="detection_result.jpg">&#8595; &nbsp; Download Result</a>
        <button class="btn-action next" id="btn-next">&#8594; &nbsp; Next Image</button>
      </div>
    </div>
  </main>

  <footer>WEAPONSCAN · YOLOV8S MINI PROJECT · DETECTION SYSTEM</footer>

  <script src="nav.js"></script>
  <script src="script.js"></script>
</body>
</html>
