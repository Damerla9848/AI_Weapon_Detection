<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WeaponScan — Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="nav.css"/>
  <link rel="stylesheet" href="auth.style.css"/>
</head>
<body>
  <main>
    <div class="page-title">
      <h1>System Access</h1>
      <div class="accent-line"></div>
      <p>AUTHENTICATE TO ACCESS · WEAPONSCAN DETECTION SYSTEM</p>
    </div>
    <div class="auth-card" id="auth-card">
      <div class="br"></div><div class="bl"></div>
      <div class="scan-bar" id="scan-bar"></div>
      <div class="tab-row">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>
      <div class="alert" id="alert-box"></div>
      <!-- LOGIN -->
      <div class="form-panel active" id="panel-login">
        <div class="field">
          <label class="field-label">Operator ID / Email</label>
          <div class="field-wrap">
            <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input class="field-input" type="text" id="login-email" placeholder="operator@domain.com" autocomplete="username"/>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Access Code</label>
          <div class="field-wrap">
            <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
            <input class="field-input" type="password" id="login-pass" placeholder="••••••••••" autocomplete="current-password"/>
            <button class="eye-btn" onclick="togglePass('login-pass', this)" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <div class="forgot-row"><a href="#" class="forgot-link" onclick="showForgot(event)">Forgot Access Code?</a></div>
        <button class="btn-submit" onclick="handleLogin()">&#x25BA;&nbsp; Authenticate</button>
        <div class="divider"><div class="divider-line"></div><div class="divider-text">or continue with</div><div class="divider-line"></div></div>
        <div class="oauth-row">
          <button class="btn-oauth" onclick="oauthMsg()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
          <button class="btn-oauth" onclick="oauthMsg()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            GitHub
          </button>
        </div>
      </div>
      <!-- REGISTER -->
      <div class="form-panel" id="panel-register">
        <div class="field">
          <label class="field-label">Full Name</label>
          <div class="field-wrap">
            <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input class="field-input" type="text" id="reg-name" placeholder="John Doe" autocomplete="name"/>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Email Address</label>
          <div class="field-wrap">
            <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12
                    c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6
                    c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
            </svg>
            </span>
            <input
              class="field-input"
              type="email"
              id="reg-email"
              placeholder="operator@domain.com"
              autocomplete="email"
            />
            <span id="email-success-indicator" style="display: none; position: absolute; right: 12px; color: var(--safe); font-size: 11px; font-family: var(--font-m); font-weight: bold; align-items: center; gap: 4px;">
              ✓ VERIFIED
            </span>
          </div>
          <button
            type="button"
            class="btn-action"
            id="btn-send-otp"
            style="margin-top:8px; width: 100%; display: block;"
            onclick="sendOtp()">
            Send Verification Code
          </button>

          <!-- Progressive verification container -->
          <div id="otp-container" style="display: none; margin-top: 10px;">
            <label class="field-label" style="font-size: 9px; margin-bottom: 4px; display: block;">Verification Code</label>
            <div class="field-wrap">
              <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
              <input
                class="field-input"
                id="otp-input"
                placeholder="Enter 6-digit OTP"
                type="text"
                maxlength="6"
                style="letter-spacing: 4px; font-size: 14px; text-align: center; padding-left: 14px;"
              />
            </div>
            <button
              type="button"
              class="btn-submit"
              style="margin-top:8px;"
              onclick="verifyOtp()">
              Verify Code
            </button>
          </div>
        </div>
        <div class="field">
          <label class="field-label">Access Code</label>
          <div class="field-wrap">
            <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
            <input class="field-input" type="password" id="reg-pass" placeholder="••••••••••" oninput="checkStrength(this.value)" autocomplete="new-password"/>
            <button class="eye-btn" onclick="togglePass('reg-pass', this)" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="strength-row">
            <div class="strength-seg" id="seg1"></div><div class="strength-seg" id="seg2"></div>
            <div class="strength-seg" id="seg3"></div><div class="strength-seg" id="seg4"></div>
          </div>
          <div class="strength-label" id="strength-label">Enter password</div>
        </div>
        <div class="field">
          <label class="field-label">Confirm Access Code</label>
          <div class="field-wrap">
            <span class="field-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
            <input class="field-input" type="password" id="reg-confirm" placeholder="••••••••••" autocomplete="new-password"/>
            <button class="eye-btn" onclick="togglePass('reg-confirm', this)" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
        </div>
        <button class="btn-submit" onclick="handleRegister()">&#x2B21;&nbsp; Create Account</button>
        <div class="terms-row">By registering you agree to our <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a></div>
      </div>
    </div>
  </main>
  <footer>WEAPONSCAN · YOLOV8S MINI PROJECT · SECURE AUTHENTICATION PORTAL</footer>
  <script src="nav.js"></script>
  <script src="auth.script.js"></script>
</body>
</html>
